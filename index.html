<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Report Issue</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; background: #ffffff; color: #222222; margin: 0; }
    h3 { margin-top: 0; color: #1c2b36; }
    label { font-weight: 600; font-size: 14px; margin-top: 14px; display: block; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #d2d6dc; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #fdfdfd; }
    button { width: 100%; padding: 12px; margin-top: 20px; background: #2481cc; color: #ffffff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: background 0.2s; }
    button:disabled { background: #9bbcd4; cursor: not-allowed; }
    #status-msg { margin-top: 15px; font-size: 14px; text-align: center; font-weight: 500; }
  </style>
</head>
<body>
  <h3>🔧 Submit Maintenance Request</h3>
  <form id="issueForm">
    <label>Flat / Unit Number</label>
    <input type="text" id="flat_no" placeholder="e.g., Tower B - 402" required />

    <label>Category</label>
    <select id="category" required>
      <option value="Plumbing">🚰 Plumbing / Water Leak</option>
      <option value="Electrical">⚡ Electrical / Power</option>
      <option value="Elevator">🛗 Elevator / Lift</option>
      <option value="Housekeeping">🧹 Housekeeping / Cleaning</option>
      <option value="Security">🛡️ Security / Intercom</option>
    </select>

    <label>Urgency Level</label>
    <select id="urgency" required>
      <option value="Routine">Routine (Within 24-48 hrs)</option>
      <option value="Urgent">Urgent / Safety Hazard (Within 2-4 hrs)</option>
    </select>

    <label>Description</label>
    <textarea id="description" rows="3" placeholder="Describe the issue..." required></textarea>

    <button type="submit" id="submitBtn">Submit Ticket</button>
  </form>

  <div id="status-msg"></div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Extract Telegram User metadata if available
    const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : {};

    document.getElementById('issueForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('status-msg');
      
      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";
      statusMsg.style.color = "#555";
      statusMsg.innerText = "Sending details...";

      const payload = {
        flat_no: document.getElementById('flat_no').value,
        category: document.getElementById('category').value,
        urgency: document.getElementById('urgency').value,
        description: document.getElementById('description').value,
        chat_id: tgUser.id || null,
        resident_name: tgUser.first_name ? `${tgUser.first_name} ${tgUser.last_name || ''}`.trim() : "Resident"
      };

      try {
        // REPLACE THIS URL WITH YOUR N8N WEBHOOK URL
        const response = await fetch('YOUR_N8N_WEBHOOK_URL_HERE', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          statusMsg.style.color = "green";
          statusMsg.innerText = "✅ Ticket submitted successfully!";
          submitBtn.innerText = "Sent";
          if (tg && typeof tg.close === 'function') {
            setTimeout(() => tg.close(), 1200);
          }
        } else {
          throw new Error("Server returned status " + response.status);
        }
      } catch (err) {
        statusMsg.style.color = "red";
        statusMsg.innerText = "Failed to submit: " + err.message;
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Ticket";
      }
    });
  </script>
</body>
</html>
